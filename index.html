<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="stars"></div>

<div class="envelope-container" id="envelope-screen">
    <div class="envelope-wrapper">
        <div class="envelope">
            <div class="letter">
                <p class="letter-preview">Para Ti ❤️</p>
            </div>
        </div>

        <div class="heart-btn" onclick="openEnvelope()">
            <div class="heart"></div>
            <div class="text">Abrir Carta</div>
        </div>
    </div>
</div>

<div class="main-scene" id="main-scene">

    <div class="content-box">

        <h1 class="main-title">Para el amor de mi vida</h1>

        <p class="poem">
            Si pudiera elegir un lugar seguro, sería a tu lado.<br>
            Cuanto más tiempo estoy contigo más te amo.<br>
            Eres mi casualidad más bonita y mi lugar favorito en el mundo.
        </p>

        <div class="tree-wrapper">
            <canvas id="treeCanvas"></canvas>
        </div>

        <h2 class="final-msg">— I Love You! —</h2>

        <div class="timer">
            <span id="counter"></span>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
